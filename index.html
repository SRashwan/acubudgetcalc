        // --- 3. Core Logic ---
        function calculateTotals() {
            let preProd = 0, prod = 0, postProd = 0;

            state.data.forEach(item => {
                const total = (item.qty || 0) * (item.days || 0) * (item.price || 0);
                const net = Math.max(0, total - (item.free || 0));
                
                item._total = total;
                item._net = net;

                if (item.phase === 'preProd') preProd += net;
                if (item.phase === 'prod') prod += net;
                if (item.phase === 'postProd') postProd += net;
            });

            const subTotal = preProd + prod + postProd;
            const contingency = subTotal * ((state.settings.contingencyRate || 0) / 100);
            const grandTotal = subTotal + contingency;
            const perPerson = state.settings.teamSize > 0 ? grandTotal / state.settings.teamSize : 0;

            state.totals = { preProd, prod, postProd, contingency, grandTotal, perPerson };
        }

        // Fullscreen Toggle

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
                document.getElementById('fs-icon').classList.replace('fa-expand', 'fa-compress');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('fs-icon').classList.replace('fa-compress', 'fa-expand');
                }
            }
        }

                                <div class="relative z-10 flex flex-col items-center cursor-pointer" onclick="goToStep(${step})">
                                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-bold text-sm md:text-base border-2 transition-all duration-300 bg-white ${state.currentStep >= step ? 'border-blue-600 text-blue-600 shadow-md' : 'border-gray-300 text-gray-400'}">

                                <div class="relative">
                                    <i class="fa-solid fa-wallet absolute top-3.5 ${state.lang==='ar'?'right-3':'left-3'} ${isOverBudget ? 'text-red-400' : 'text-gray-400'} text-sm"></i>
                                    <input type="number" min="0" data-setting="maxBudget" value="${state.settings.maxBudget}" class="sync-setting w-full border ${isOverBudget ? 'border-red-400 ring-1 ring-red-400' : 'border-gray-300'} rounded-lg p-2.5 ${state.lang==='ar'?'pr-9':'pl-9'} focus:ring-2 focus:ring-blue-500 outline-none font-bold text-gray-700">
                                </div>
                            </div>
                        </div>

                        <!-- Crew Panel -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2"><i class="fa-solid fa-id-card-clip text-blue-500 mr-1 ml-1"></i> ${t('crewNames')}</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 gap-3">
                                ${state.crew.map((member, idx) => `
                                    <div class="flex flex-col gap-2 p-3 bg-gray-50 rounded-xl border border-gray-200 avoid-break">
                                        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider"># ${idx + 1}</span>
                                        <input type="text" data-index="${idx}" data-field="name" class="sync-crew w-full bg-white border border-gray-200 rounded p-1.5 text-sm focus:ring-1 focus:ring-blue-500 outline-none" placeholder="${t('studentName')}" value="${esc(member.name)}">
                                        <input type="text" data-index="${idx}" data-field="studentId" class="sync-crew w-full bg-white border border-gray-200 rounded p-1.5 text-sm focus:ring-1 focus:ring-blue-500 outline-none font-mono" placeholder="${t('studentId')}" value="${esc(member.studentId)}">
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- File Uploads Panel (Optional) -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 avoid-break">
                            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b border-gray-100 pb-2">
                                <i class="fa-solid fa-cloud-arrow-up text-blue-500 mr-1 ml-1"></i> ${t('optionalUploads')}
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-600">${t('scriptUpload')}</label>
                                    <input type="file" id="upload-script" accept=".pdf,.doc,.docx" class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-200 rounded-xl p-2 focus:outline-none transition-all">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-sm font-semibold text-gray-600">${t('scoutingUpload')}</label>
                                    <input type="file" id="upload-scouting" accept="image/*" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-200 rounded-xl p-2 focus:outline-none transition-all">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- STEP 2: Pre-Production -->
                    <div id="step-content-2" class="step-content ${state.currentStep === 2 ? '' : 'hidden'}">
                        ${renderTable(phasesConfig[0])}
                    </div>

                    <!-- STEP 3: Production -->
                    <div id="step-content-3" class="step-content ${state.currentStep === 3 ? '' : 'hidden'}">
                        ${renderTable(phasesConfig[1])}
                    </div>

                    <!-- STEP 4: Post-Production -->
                    <div id="step-content-4" class="step-content ${state.currentStep === 4 ? '' : 'hidden'}">
                        ${renderTable(phasesConfig[2])}
                    </div>

                    <!-- STEP 5: Summary & Dashboard -->
                    <div id="step-content-5" class="step-content space-y-6 avoid-break ${state.currentStep === 5 ? '' : 'hidden'}">
                        <!-- Dashboard / Summaries -->
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-blue-100 border-b-4 border-b-blue-400">
                                <h3 class="text-xs md:text-sm text-gray-500 font-semibold mb-1">${t('preProdTitle')}</h3>
                                <p class="text-lg md:text-xl font-bold text-blue-900" id="summary-preProd">${state.totals.preProd.toLocaleString()} ${t('currency')}</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-orange-100 border-b-4 border-b-orange-400">
                                <h3 class="text-xs md:text-sm text-gray-500 font-semibold mb-1">${t('prodTitle')}</h3>
                                <p class="text-lg md:text-xl font-bold text-orange-900" id="summary-prod">${state.totals.prod.toLocaleString()} ${t('currency')}</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-purple-100 border-b-4 border-b-purple-400">
                                <h3 class="text-xs md:text-sm text-gray-500 font-semibold mb-1">${t('postProdTitle')}</h3>
                                <p class="text-lg md:text-xl font-bold text-purple-900" id="summary-postProd">${state.totals.postProd.toLocaleString()} ${t('currency')}</p>
                            </div>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 border-b-4 border-b-gray-400">
                                <h3 class="text-xs md:text-sm text-gray-500 font-semibold mb-1">${t('contingencyTitle')} <span id="lbl-contingency-rate">(${state.settings.contingencyRate}%)</span></h3>
                                <p class="text-lg md:text-xl font-bold text-gray-700" id="summary-contingency">${state.totals.contingency.toLocaleString()} ${t('currency')}</p>
                            </div>
                            <div class="col-span-2 md:col-span-4 lg:col-span-1 bg-gradient-to-br ${grandTotalBgClass} p-4 rounded-xl shadow-sm text-white flex flex-col justify-center relative transition-all duration-300">
                                <h3 class="text-xs md:text-sm text-blue-100 font-semibold mb-1">${t('grandTotalTitle')}</h3>
                                <p class="text-2xl md:text-3xl font-extrabold" id="summary-grandTotal">${state.totals.grandTotal.toLocaleString()} <span class="text-sm font-normal opacity-80">${t('currency')}</span></p>
                                ${isOverBudget ? `<div class="absolute top-2 ${state.lang === 'ar' ? 'left-2' : 'right-2'} text-red-200 text-xs font-bold animate-pulse"><i class="fa-solid fa-triangle-exclamation"></i> ${t('overBudgetWarn')}</div>` : ''}
                            </div>
                        </div>

                        <!-- Per Person Badge & Suggestions -->
                        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="w-full md:w-auto">
                                ${isOverBudget ? `
                                <button onclick="suggestReductions()" class="w-full md:w-auto bg-amber-500 hover:bg-amber-600 text-white px-5 py-2 rounded-lg font-bold shadow-md transition-all flex items-center justify-center gap-2 animate-bounce">
                                    <i class="fa-solid fa-lightbulb"></i> ${t('suggestBtn')}
                                </button>` : '<div></div>'}
                            </div>
                            <div class="bg-green-50 border border-green-200 px-5 py-3 rounded-xl flex items-center justify-between md:justify-end gap-3 text-green-800 shadow-sm w-full md:w-auto">
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-user-tag text-lg"></i>
                                    <span class="font-semibold">${t('perPersonTitle')}</span>
                                </div>
                                <span class="font-extrabold text-xl bg-white px-3 py-1 rounded-lg border border-green-100" id="summary-perPerson">${state.totals.perPerson.toLocaleString(undefined, { maximumFractionDigits: 0 })} ${t('currency')}</span>
                            </div>
                        </div>

                        <!-- Export Buttons placed at the end for logical flow -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-center items-center gap-4 mt-8">
                            <button id="pdf-export-btn" onclick="exportArtisticPDF()" class="w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold transition-colors flex items-center justify-center gap-2 text-lg shadow-md">
                                <i class="fa-solid fa-print"></i> ${t('exportPdf')}
                            </button>
                            <button onclick="exportExcel()" class="w-full md:w-auto px-8 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-bold transition-colors flex items-center justify-center gap-2 shadow-md text-lg">
                                <i class="fa-solid fa-file-excel"></i> ${t('exportExcel')}
                            </button>
                        </div>
                    </div>

                    <!-- Pagination Controls -->
                    <div id="pagination-controls" class="flex justify-between items-center mt-8 border-t border-gray-200 pt-6">
                        <button onclick="goToStep(state.currentStep - 1)" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-xl font-bold transition-all flex items-center ${state.currentStep === 1 ? 'opacity-50 cursor-not-allowed pointer-events-none' : ''}">
                            <i class="fa-solid ${state.lang === 'ar' ? 'fa-arrow-right' : 'fa-arrow-left'} mx-2"></i> <span class="hidden md:inline">${t('prev')}</span>
                        </button>
                        <button onclick="goToStep(state.currentStep + 1)" class="px-5 py-2.5 ${state.currentStep === 5 ? 'bg-green-600 hover:bg-green-700' : 'bg-blue-600 hover:bg-blue-700'} text-white rounded-xl font-bold shadow-md transition-all flex items-center">
                            <span class="hidden md:inline">${state.currentStep === 5 ? t('finish') : t('next')}</span> <i class="fa-solid ${state.currentStep === 5 ? 'fa-check' : (state.lang === 'ar' ? 'fa-arrow-left' : 'fa-arrow-right')} mx-2"></i>
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('app').innerHTML = html;
            document.querySelectorAll('textarea.auto-expand').forEach(ta => autoExpand(ta));
        }

        // --- Render Table (Mobile Card View & Desktop Row View) ---
        function renderTable(config) {
            const phaseData = state.data.filter(d => d.phase === config.id);
            const colorClass = config.color; 
            
            let rowsHtml = phaseData.map(row => {
                const itemField = `item_${state.lang}`;
                const descField = `desc_${state.lang}`;
                return `
                <tr class="block md:table-row bg-white md:bg-transparent border border-gray-200 md:border-none rounded-xl md:rounded-none mb-4 md:mb-0 p-3 md:p-0 shadow-sm md:shadow-none group transition-colors hover:bg-gray-50" data-id="${row.id}">
                    <!-- Card layout for mobile (block/flex), Table-cell for desktop -->
                    <td class="flex md:table-cell flex-col md:flex-row justify-start items-start md:align-top p-2 md:w-[22%] border-b border-gray-100 md:border-b md:border-gray-100">
                        <div class="md:hidden text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">${t('colItem')}</div>
                        <textarea rows="1" class="sync-data auto-expand w-full bg-transparent border border-gray-200 md:border-transparent hover:border-gray-300 focus:border-${colorClass}-500 outline-none p-2 md:p-1 font-bold md:font-semibold text-gray-800 md:text-gray-700 rounded md:rounded-none" data-field="${itemField}" oninput="autoExpand(this)">${esc(row[itemField])}</textarea>
                    </td>
                    
                    <td class="flex md:table-cell flex-col md:flex-row justify-start items-start md:align-top p-2 md:w-[35%] border-b border-gray-100 md:border-b md:border-gray-100">
                        <div class="md:hidden text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">${t('colDesc')}</div>
                        <textarea rows="1" class="sync-data auto-expand w-full bg-transparent border border-gray-200 md:border-transparent hover:border-gray-300 focus:border-${colorClass}-500 outline-none p-2 md:p-1 text-sm text-gray-600 md:text-gray-500 rounded md:rounded-none" data-field="${descField}" oninput="autoExpand(this)">${esc(row[descField])}</textarea>
                    </td>
                    
                    <td class="flex md:table-cell justify-between items-center md:items-start md:align-top p-2 md:w-[8%] border-b border-gray-100 md:border-b md:border-gray-100">
                        <div class="md:hidden text-xs font-bold text-gray-500 uppercase tracking-wider">${t('colQty')}</div>
                        <input type="number" min="0" class="sync-data w-24 md:w-full min-w-[40px] border border-gray-200 rounded p-1.5 text-center text-sm focus:ring-1 focus:ring-${colorClass}-500 outline-none font-bold md:font-normal" data-field="qty" value="${row.qty}">
                    </td>
                    
                    <td class="flex md:table-cell justify-between items-center md:items-start md:align-top p-2 md:w-[8%] border-b border-gray-100 md:border-b md:border-gray-100">
                        <div class="md:hidden text-xs font-bold text-gray-500 uppercase tracking-wider">${t('colDays')}</div>
                        <input type="number" min="0" class="sync-data w-24 md:w-full min-w-[40px] border border-gray-200 rounded p-1.5 text-center text-sm focus:ring-1 focus:ring-${colorClass}-500 outline-none font-bold md:font-normal" data-field="days" value="${row.days}">
                    </td>
                    
                    <td class="flex md:table-cell justify-between items-center md:items-start md:align-top p-2 md:w-[10%] border-b border-gray-100 md:border-b md:border-gray-100">
                        <div class="md:hidden text-xs font-bold text-gray-500 uppercase tracking-wider">${t('colPrice')}</div>
                        <input type="number" min="0" class="sync-data w-24 md:w-full min-w-[50px] border border-gray-200 rounded p-1.5 text-center text-sm focus:ring-1 focus:ring-${colorClass}-500 outline-none font-bold md:font-normal" data-field="price" value="${row.price}">
                    </td>
                    
                    <td class="flex md:table-cell justify-between items-center md:align-top p-2 md:w-[10%] md:text-center text-sm font-semibold text-gray-600 bg-gray-50 border-b border-gray-100 md:border-b md:border-gray-100 row-total rounded md:rounded-none my-1 md:my-0" data-id="${row.id}">
                        <div class="md:hidden text-xs font-bold text-gray-500 uppercase tracking-wider">${t('colTotal')}</div>
                        <span>${row._total.toLocaleString()}</span>
                    </td>
                    
                    <td class="flex md:table-cell justify-between items-center md:items-start md:align-top p-2 md:w-[10%] border-b border-gray-100 md:border-b md:border-gray-100">
                        <div class="md:hidden text-xs font-bold text-green-600 uppercase tracking-wider">${t('colFree')}</div>
                        <input type="number" min="0" class="sync-data w-24 md:w-full min-w-[50px] border border-green-300 bg-green-50 text-green-700 font-bold rounded p-1.5 text-center text-sm focus:ring-1 focus:ring-green-500 outline-none" data-field="free" value="${row.free}">
                    </td>
                    
                    <td class="flex md:table-cell justify-between items-center md:align-top p-2 md:w-[10%] md:text-center text-base md:text-sm font-black text-${colorClass}-800 bg-${colorClass}-50 md:bg-transparent border-b border-gray-100 md:border-b md:border-gray-100 row-net rounded md:rounded-none my-1 md:my-0" data-id="${row.id}">
                        <div class="md:hidden text-xs font-bold text-${colorClass}-800 uppercase tracking-wider">${t('colNet')}</div>
                        <span>${row._net.toLocaleString()}</span>
                    </td>
                    
                    <td class="block md:table-cell p-2 md:w-[5%] align-top text-center">
                        <button onclick="deleteRow(${row.id})" class="w-full md:w-auto bg-red-50 md:bg-transparent text-red-400 hover:text-red-600 hover:bg-red-100 transition-colors p-2 md:p-1 mt-2 md:mt-1 rounded md:rounded-none flex justify-center items-center gap-2" title="Delete">
                            <i class="fa-solid fa-trash"></i> <span class="md:hidden font-bold text-sm">حذف البند</span>
                        </button>
                    </td>
                </tr>
            `}).join('');

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden mb-6">
                    <div class="bg-gray-50 px-4 md:px-5 py-3 md:py-4 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-base md:text-lg font-bold text-gray-800 border-b-2 border-${colorClass}-500 pb-1">${t(config.key)}</h2>
                        <button onclick="addRow('${config.id}')" class="text-xs md:text-sm flex items-center gap-1 md:gap-2 text-${colorClass}-600 hover:text-${colorClass}-800 font-semibold bg-white border border-${colorClass}-200 px-3 py-1.5 rounded-lg shadow-sm transition-all">
                            <i class="fa-solid fa-plus"></i> <span>${t('addRow')}</span>
                        </button>
                    </div>
                    <div class="w-full bg-gray-50 md:bg-white p-2 md:p-0">
                        <table class="w-full text-${state.lang === 'ar' ? 'right' : 'left'} border-collapse">
                            <thead class="hidden md:table-header-group bg-white text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
                                <tr>
                                    <th class="p-3 font-semibold">${t('colItem')}</th>
                                    <th class="p-3 font-semibold">${t('colDesc')}</th>
                                    <th class="p-3 font-semibold text-center">${t('colQty')}</th>
                                    <th class="p-3 font-semibold text-center">${t('colDays')}</th>
                                    <th class="p-3 font-semibold text-center">${t('colPrice')}</th>
                                    <th class="p-3 font-semibold text-center bg-gray-50">${t('colTotal')}</th>
                                    <th class="p-3 font-semibold text-center text-green-600">${t('colFree')}</th>
                                    <th class="p-3 font-semibold text-center">${t('colNet')}</th>
                                    <th class="p-3"></th>
                                </tr>
                            </thead>
                            <tbody class="block md:table-row-group divide-y divide-gray-100">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // --- 5. Event Listeners & Live Updates ---
        document.addEventListener('input', (e) => {
            if (e.target.classList.contains('sync-setting')) {
                const field = e.target.getAttribute('data-setting');
                let val = e.target.value;
                if (['teamSize', 'contingencyRate', 'maxBudget'].includes(field)) val = Number(val) || 0;
                
                state.settings[field] = val;

                if (field === 'teamSize') {
                    const newSize = val < 1 ? 1 : val;
                    while (state.crew.length < newSize) state.crew.push({ name: '', studentId: '' });
                    if (state.crew.length > newSize) state.crew = state.crew.slice(0, newSize);
                    render(); 
                    return;
                }
                
                if (['contingencyRate', 'maxBudget'].includes(field)) {
                    calculateTotals();
                    updateDashboardUI();
                }
            }

            if (e.target.classList.contains('sync-crew')) {
                const index = parseInt(e.target.getAttribute('data-index'));
                const field = e.target.getAttribute('data-field');
                state.crew[index][field] = e.target.value;
            }

            if (e.target.classList.contains('sync-data')) {
                const tr = e.target.closest('tr');
                const id = parseInt(tr.getAttribute('data-id'));
                const field = e.target.getAttribute('data-field');
                let val = e.target.value;

                if (['qty', 'days', 'price', 'free'].includes(field)) val = Number(val) || 0;

                const itemIndex = state.data.findIndex(d => d.id === id);
                if (itemIndex > -1) {
                    state.data[itemIndex][field] = val;
                    calculateTotals();
                    
                    const rowData = state.data[itemIndex];
                    tr.querySelector('.row-total span').innerText = rowData._total.toLocaleString();
                    tr.querySelector('.row-net span').innerText = rowData._net.toLocaleString();
                    
                    updateDashboardUI();
                }
            }
        });

        function updateDashboardUI() {
            const preProdEl = document.getElementById('summary-preProd');
            if(preProdEl) {
                preProdEl.innerText = `${state.totals.preProd.toLocaleString()} ${t('currency')}`;
                document.getElementById('summary-prod').innerText = `${state.totals.prod.toLocaleString()} ${t('currency')}`;
                document.getElementById('summary-postProd').innerText = `${state.totals.postProd.toLocaleString()} ${t('currency')}`;
                document.getElementById('summary-contingency').innerText = `${state.totals.contingency.toLocaleString()} ${t('currency')}`;
                document.getElementById('summary-grandTotal').innerHTML = `${state.totals.grandTotal.toLocaleString()} <span class="text-sm font-normal opacity-80">${t('currency')}</span>`;
                document.getElementById('summary-perPerson').innerText = `${state.totals.perPerson.toLocaleString(undefined, { maximumFractionDigits: 0 })} ${t('currency')}`;
                document.getElementById('lbl-contingency-rate').innerText = `(${state.settings.contingencyRate}%)`;
                
                const isOverBudget = state.settings.maxBudget > 0 && state.totals.grandTotal > state.settings.maxBudget;
                const totalContainer = document.getElementById('summary-grandTotal').parentElement;
                if (isOverBudget) {
                    totalContainer.classList.remove('from-blue-900', 'to-blue-800', 'border-blue-900');
                    totalContainer.classList.add('from-red-900', 'to-red-800', 'border-red-900');
                } else {
                    totalContainer.classList.remove('from-red-900', 'to-red-800', 'border-red-900');
                    totalContainer.classList.add('from-blue-900', 'to-blue-800', 'border-blue-900');
                }
            }
        }

        // --- 6. Actions ---
        window.goToStep = function(step) {
            if (step < 1) step = 1;
            if (step > 5) {
                if(step > 5) exportArtisticPDF();
                return;
            }
            state.currentStep = step;
            render();
            window.scrollTo(0, 0);
        }

        function toggleLang() {
            state.lang = state.lang === 'ar' ? 'en' : 'ar';
            render();
        }

        window.addRow = function(phase) {
            const newId = state.data.length > 0 ? Math.max(...state.data.map(d => d.id)) + 1 : 1;
            state.data.push({ 
                id: newId, 
                phase, 
                item_ar: t('newItem'), item_en: t('newItem'), 
                desc_ar: '', desc_en: '', 
                qty: 1, days: 1, price: 0, free: 0 
            });
            render();
        }

        window.deleteRow = function(id) {
            state.data = state.data.filter(d => d.id !== id);
            render();
        }

        // --- 7. Export Functions ---
        window.exportExcel = function() {
            const wb = XLSX.utils.book_new();
            wb.Workbook = { Views: [{ RTL: state.lang === 'ar' }] };
            let wsData = [];
            
            wsData.push([t('appTitle')]);
            wsData.push([t('projectName') + ":", state.settings.projectName]);
            wsData.push([t('supervisors') + ":", state.settings.supervisors]);
            wsData.push([]);

            wsData.push([t('crewNames').toUpperCase()]);
            wsData.push(["#", t('studentName'), t('studentId')]);
            state.crew.forEach((c, i) => {
                if(c.name || c.studentId) wsData.push([i+1, c.name, c.studentId]);
            });
            wsData.push([]);

            const headers = [t('colItem'), t('colDesc'), t('colQty'), t('colDays'), t('colPrice'), t('colTotal'), t('colFree'), t('colNet')];

            phasesConfig.forEach(config => {
                const phaseData = state.data.filter(d => d.phase === config.id);
                if(phaseData.length === 0) return;
                wsData.push([t(config.key).toUpperCase()]);
                wsData.push(headers);
                phaseData.forEach(row => {
                    wsData.push([
                        row[`item_${state.lang}`], row[`desc_${state.lang}`], row.qty, row.days, row.price, row._total, row.free, row._net
                    ]);
                });
                wsData.push([]); 
            });

            wsData.push(["---", "---", "---"]);
            wsData.push([t('preProdTitle'), state.totals.preProd]);
            wsData.push([t('prodTitle'), state.totals.prod]);
            wsData.push([t('postProdTitle'), state.totals.postProd]);
            wsData.push([t('contingencyTitle') + ` (${state.settings.contingencyRate}%)`, state.totals.contingency]);
            if (state.settings.maxBudget > 0) wsData.push([t('maxBudget'), state.settings.maxBudget]);
            wsData.push([t('grandTotalTitle'), state.totals.grandTotal]);
            wsData.push([t('teamSize'), state.settings.teamSize]);
            wsData.push([t('perPersonTitle'), Math.round(state.totals.perPerson)]);

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            ws['!cols'] = [ { wch: 25 }, { wch: 40 }, { wch: 10 }, { wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 15 } ];
            XLSX.utils.book_append_sheet(wb, ws, "Budget");
            XLSX.writeFile(wb, "Documentary_Budget.xlsx");
        }

        // --- NEW EXPORT ENGINE: ARTISTIC PDF GENERATOR ---
        window.exportArtisticPDF = async function() {
            const btn = document.getElementById('pdf-export-btn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ' + (state.lang === 'ar' ? 'جاري التحضير...' : 'Processing...');
            btn.disabled = true;

            try {
                // 1. Build a completely separate, perfectly formatted HTML template specifically for PDF.
                // This ensures Arabic works perfectly with Arial, and layout is strictly 1024px desktop view.
                const wrapper = document.createElement('div');
                wrapper.id = 'pdf-render-engine';
                wrapper.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
                // Use strict Arial/Tahoma to prevent ANY Arabic reversing issues in html2canvas
                wrapper.style.cssText = 'position: absolute; top: -9999px; left: 0; width: 1024px; background: #ffffff; padding: 40px; box-sizing: border-box; font-family: Arial, Tahoma, sans-serif !important; z-index: -10;';

                // Check uploads
                const scriptInput = document.getElementById('upload-script');
                const scoutingInput = document.getElementById('upload-scouting');
                const scriptFiles = scriptInput && scriptInput.files.length > 0 ? Array.from(scriptInput.files).map(f => f.name).join(', ') : '-';
                const scoutingFiles = scoutingInput && scoutingInput.files.length > 0 ? Array.from(scoutingInput.files).map(f => f.name).join(', ') : '-';

                // Generate Crew Section (Strict 2 Columns for PDF)
                let crewHtml = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px;">';
                state.crew.forEach((c, i) => {
                    if(c.name || c.studentId) {
                        crewHtml += `
                            <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-${state.lang === 'ar' ? 'right' : 'left'}: 5px solid #3b82f6; padding: 12px 16px; border-radius: 8px;">
                                <div style="color: #64748b; font-size: 13px; margin-bottom: 4px; font-weight: bold;"># ${i+1}</div>
                                <div style="font-weight: bold; font-size: 18px; color: #1e293b;">${esc(c.name) || '-'}</div>
                                <div style="color: #475569; font-size: 14px; margin-top: 4px; font-family: monospace;">ID: ${esc(c.studentId) || '-'}</div>
                            </div>
                        `;
                    }
                });
                crewHtml += '</div>';

                // Generate Tables Function
                const buildPdfTable = (phaseId, title) => {
                    const items = state.data.filter(d => d.phase === phaseId);
                    if(items.length === 0) return '';
                    
                    let rows = '';
                    items.forEach((item, index) => {
                        const bg = index % 2 === 0 ? 'background-color: #f8fafc;' : 'background-color: #ffffff;';
                        rows += `
                            <tr style="${bg} border-bottom: 1px solid #e2e8f0;">
                                <td style="padding: 14px; font-weight: bold; color: #1e293b; border-bottom: 1px solid #e2e8f0;">${esc(item[`item_${state.lang}`])}</td>
                                <td style="padding: 14px; color: #475569; font-size: 14px; border-bottom: 1px solid #e2e8f0;">${esc(item[`desc_${state.lang}`])}</td>
                                <td style="padding: 14px; text-align: center; border-bottom: 1px solid #e2e8f0;">${item.qty}</td>
                                <td style="padding: 14px; text-align: center; border-bottom: 1px solid #e2e8f0;">${item.days}</td>
                                <td style="padding: 14px; text-align: center; border-bottom: 1px solid #e2e8f0;">${item.price}</td>
                                <td style="padding: 14px; text-align: center; font-weight: bold; color: #475569; border-bottom: 1px solid #e2e8f0;">${item._total.toLocaleString()}</td>
                                <td style="padding: 14px; text-align: center; color: #16a34a; border-bottom: 1px solid #e2e8f0;">${item.free}</td>
                                <td style="padding: 14px; text-align: center; font-weight: bold; color: #1d4ed8; border-bottom: 1px solid #e2e8f0;">${item._net.toLocaleString()}</td>
                            </tr>
                        `;
                    });

                    return `
                        <div style="margin-bottom: 40px; border-radius: 12px; overflow: hidden; border: 1px solid #cbd5e1; page-break-inside: avoid;">
                            <div style="background-color: #1e3a8a; color: white; padding: 16px 20px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
                                <span>${title}</span>
                                <span style="font-size: 12px; opacity: 0.7; font-weight: normal;">ACU Smart Budget</span>
                            </div>
                            <table style="width: 100%; border-collapse: collapse; text-align: ${state.lang === 'ar' ? 'right' : 'left'};">
                                <thead style="background-color: #eff6ff; color: #1e3a8a; font-size: 14px;">
                                    <tr>
                                        <th style="padding: 14px; border-bottom: 2px solid #bfdbfe;">${t('colItem')}</th>
                                        <th style="padding: 14px; border-bottom: 2px solid #bfdbfe;">${t('colDesc')}</th>
                                        <th style="padding: 14px; text-align: center; border-bottom: 2px solid #bfdbfe;">${t('colQty')}</th>
                                        <th style="padding: 14px; text-align: center; border-bottom: 2px solid #bfdbfe;">${t('colDays')}</th>
                                        <th style="padding: 14px; text-align: center; border-bottom: 2px solid #bfdbfe;">${t('colPrice')}</th>
                                        <th style="padding: 14px; text-align: center; border-bottom: 2px solid #bfdbfe;">${t('colTotal')}</th>
                                        <th style="padding: 14px; text-align: center; border-bottom: 2px solid #bfdbfe;">${t('colFree')}</th>
                                        <th style="padding: 14px; text-align: center; border-bottom: 2px solid #bfdbfe;">${t('colNet')}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows}
                                </tbody>
                            </table>
                        </div>
                    `;
                };

                // Compile Entire Template
                wrapper.innerHTML = `
                    <!-- Artistic Header -->
                    <div style="background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); border-radius: 20px; padding: 40px; color: white; position: relative; overflow: hidden; margin-bottom: 40px; box-shadow: 0 10px 25px rgba(30, 58, 138, 0.15);">
                        <!-- Decor circles -->
                        <div style="position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: rgba(255,255,255,0.1); border-radius: 50%;"></div>
                        <div style="position: absolute; bottom: -80px; left: 10%; width: 300px; height: 300px; background: rgba(255,255,255,0.05); border-radius: 50%;"></div>
                        
                        <div style="position: relative; z-index: 10; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h1 style="font-size: 38px; font-weight: 800; margin: 0 0 10px 0; line-height: 1.2;">ACU Budget Calculator</h1>
                                <h2 style="font-size: 22px; font-weight: 600; margin: 0; opacity: 0.9;">${state.lang === 'ar' ? 'الميزانية الرسمية المعتمدة - فيلم وثائقي' : 'Official Approved Budget - Documentary'}</h2>
                            </div>
                            <div style="text-align: ${state.lang === 'ar' ? 'left' : 'right'}; background: rgba(255,255,255,0.15); padding: 20px; border-radius: 12px; min-width: 250px;">
                                <div style="font-size: 14px; opacity: 0.9; margin-bottom: 5px;">${t('projectName')}</div>
                                <div style="font-size: 24px; font-weight: bold;">${esc(state.settings.projectName) || 'Untitled Project'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Overview Cards -->
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;">
                        <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;">
                            <div style="color: #64748b; font-size: 14px; font-weight: bold; margin-bottom: 8px;">${t('supervisors')}</div>
                            <div style="color: #1e293b; font-size: 18px; font-weight: bold;">${esc(state.settings.supervisors) || '-'}</div>
                        </div>
                        <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px;">
                            <div style="color: #64748b; font-size: 14px; font-weight: bold; margin-bottom: 8px;">${t('teamSize')} / ${t('contingencyRate')}</div>
                            <div style="color: #1e293b; font-size: 18px; font-weight: bold;">${state.settings.teamSize} Members | ${state.settings.contingencyRate}%</div>
                        </div>
                        <div style="background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 20px;">
                            <div style="color: #ef4444; font-size: 14px; font-weight: bold; margin-bottom: 8px;">${t('maxBudget')}</div>
                            <div style="color: #991b1b; font-size: 18px; font-weight: bold;">${state.settings.maxBudget > 0 ? state.settings.maxBudget.toLocaleString() + ' ' + t('currency') : 'N/A'}</div>
                        </div>
                    </div>

                    <!-- Crew Section -->
                    <h3 style="font-size: 22px; font-weight: bold; color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">${t('crewNames')}</h3>
                    ${crewHtml}

                    <!-- File Attachments Reference -->
                    <h3 style="font-size: 22px; font-weight: bold; color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 40px;">${t('optionalUploads')}</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px;">
                        <div style="background-color: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <strong style="display:block; margin-bottom: 5px; color: #64748b;">${t('scriptUpload')}:</strong>
                            <span style="color: #1e293b;">${scriptFiles}</span>
                        </div>
                        <div style="background-color: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <strong style="display:block; margin-bottom: 5px; color: #64748b;">${t('scoutingUpload')}:</strong>
                            <span style="color: #1e293b;">${scoutingFiles}</span>
                        </div>
                    </div>

                    <!-- Tables -->
                    <h3 style="font-size: 22px; font-weight: bold; color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 40px;">${state.lang === 'ar' ? 'التفاصيل المالية' : 'Financial Details'}</h3>
                    ${buildPdfTable('preProd', t('preProdTitle'))}
                    ${buildPdfTable('prod', t('prodTitle'))}
                    ${buildPdfTable('postProd', t('postProdTitle'))}

                    <!-- Grand Total Summary -->
                    <div style="background-color: #f0fdf4; border: 2px solid #22c55e; border-radius: 16px; padding: 30px; margin-top: 40px; display: flex; justify-content: space-between; align-items: center; page-break-inside: avoid;">
                        <div>
                            <div style="font-size: 18px; color: #166534; font-weight: bold; margin-bottom: 10px;">${t('grandTotalTitle')}</div>
                            <div style="font-size: 46px; color: #15803d; font-weight: 900; line-height: 1;">${state.totals.grandTotal.toLocaleString()} <span style="font-size: 22px;">${t('currency')}</span></div>
                        </div>
                        <div style="text-align: ${state.lang === 'ar' ? 'left' : 'right'};">
                            <div style="font-size: 16px; color: #166534; font-weight: bold; margin-bottom: 8px;">${t('perPersonTitle')}</div>
                            <div style="font-size: 28px; color: #15803d; font-weight: bold; background: white; padding: 5px 15px; border-radius: 8px;">${state.totals.perPerson.toLocaleString(undefined, { maximumFractionDigits: 0 })} ${t('currency')}</div>
                        </div>
                    </div>

                    <!-- Signatures -->
                    <div style="display: flex; justify-content: space-around; margin-top: 80px; padding-top: 40px; border-top: 1px solid #cbd5e1; page-break-inside: avoid;">
                        <div style="text-align: center; width: 40%;">
                            <div style="font-size: 18px; font-weight: bold; color: #334155; margin-bottom: 60px;">${t('sigSupervisor')}</div>
                            <div style="border-bottom: 2px solid #94a3b8; margin-bottom: 10px;"></div>
                            <div style="font-size: 16px; color: #475569; font-weight: bold;">${esc(state.settings.supervisors) || '................................'}</div>
                        </div>
                        <div style="text-align: center; width: 40%;">
                            <div style="font-size: 18px; font-weight: bold; color: #334155; margin-bottom: 60px;">${t('sigDean')}</div>
                            <div style="border-bottom: 2px solid #94a3b8; margin-bottom: 10px;"></div>
                            <div style="font-size: 16px; color: #475569;">................................</div>
                        </div>
                    </div>
                `;

                document.body.appendChild(wrapper);

                // Let the browser digest the DOM and load fonts properly to avoid Arabic issues
                await new Promise(resolve => setTimeout(resolve, 800));

                const canvas = await html2canvas(wrapper, {
                    scale: 2, 
                    useCORS: true,
                    allowTaint: true,
                    windowWidth: 1024,
                    backgroundColor: '#ffffff'
                    // removed letterRendering option completely to let browser default logic handle it smoothly
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.98);
                const { jsPDF } = window.jspdf;
                
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const imgProps = pdf.getImageProperties(imgData);
                const imgHeightInMm = (imgProps.height * pdfWidth) / imgProps.width;

                let heightLeft = imgHeightInMm;
                let position = 0;

                pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMm);
                heightLeft -= pdfHeight;

                while (heightLeft > 0) {
                    position = heightLeft - imgHeightInMm;
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, position, pdfWidth, imgHeightInMm);
                    heightLeft -= pdfHeight;
                }

                pdf.save('ACU_Documentary_Budget_Report.pdf');
                
                // Cleanup
                document.body.removeChild(wrapper);

            } catch (error) {
                console.error("PDF Generation Error:", error);
                alert(state.lang === 'ar' ? 'عذراً، حدث خطأ أثناء التصدير.' : 'Sorry, an error occurred during PDF generation.');
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

        // --- 8. Initialize ---
        render();

    </script>
</body>
</html>
